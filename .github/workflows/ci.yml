name: CI

# One workflow for everything, so the Actions tab shows a single entry per
# run instead of four unrelated ones (the corpus run alone has its own
# workflow, corpus.yml, started by hand):
#
#   lint             luacheck, hosted on its own Lua 5.1 (see below)
#   test             Lua 5.5 test suite, per OS
#   cli-golden       CLI comparison against Perl exiftool, per OS
#   capi             C API, "rock" build against the rocks, per OS: its
#                    tests and image_info against Perl's Image::ExifTool
#                    (the embedded builds and ThreadSanitizer: capi.yml,
#                    manual)
#   standalone       standalone executables (linux, macos, windows), matrix
#   macos-smoke      runs the built macOS universal binary on a macOS runner
#   windows-smoke    runs the built Windows executable on a Windows runner
#   benchmark        performance comparison with the Perl original on the
#                    Linux executable of this run (benchmark.yml)
#   publish-latest-dev  master: the rolling "latest-dev" pre-release with
#                    the three executables, the benchmark chart and table
#   publish-release  version tag: the release, same contents
#                    (benchmark.yml; on master it also deploys the chart to
#                    the Pages site, the image the README and the release
#                    notes show)
#
# Push to master and manual runs do everything; pull requests run lint +
# test only (the standalone builds and the CLI reference runs are expensive
# and are not a PR gate). Every push to master republishes the executables
# as the pre-release "latest-dev" (the download the README offers), so the
# newest commit is always available without waiting for a tagged version;
# the benchmark runs in the same chain, on the same binaries, and its chart
# is part of the pre-release -- what the README shows is measured on what
# it offers. A version tag builds and publishes the release only: the
# tagged commit has already been checked by its master run, and a release
# should not wait for the test matrix.
#
# Tags: vX.Y.Z, X.Y the ExifTool version the port tracks, Z the port's
# patch level. Z = 0 is the genesis tag on the bare vendor/exiftool commit
# of that ExifTool version -- the base `git describe` counts from
# (snapshots read v13.64.0-7-g7bc0992), not a release, so the tag filter
# below leaves it out; Z >= 1 are the releases.

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[1-9]*"]   # releases only, not the vX.Y.0 genesis tags
  pull_request:
  workflow_dispatch:

# Read-only by default; only the publishing jobs write (the latest-dev
# pre-release, the release assets of a version tag).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs. A tag
  # run is never cancelled: a release upload may be in progress.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Single Lua version by policy: Lua 5.5 only, no version matrix (unlike the
# lua-lpcre/lua-compress reference workflows, which test every Lua version).
# OS matrix only. `make check` (sys + test + lint) targets both Lua 5.4 and
# 5.5, so the test job calls the 5.5 pieces directly (`make sys5.5` and the
# test runner), reproducing the same quality gate under Lua 5.5 alone (lint
# runs as a job of its own).
#
# `lint` (luacheck, hosted on its own Lua 5.1 -- see below) is a separate
# job, not a step of `test`: luarocks/gh-actions-lua installs every Lua
# version into the same fixed ./.lua (symlinked to its per-version
# tool-cache directory only the first time that path doesn't exist yet), so
# installing two Lua versions in one job leaves the second one's luarocks
# -- and everything built against it, including lexiftool.sys -- silently
# pointed at the first version's headers. One Lua version per job sidesteps
# that; it also means the 5.1 install (for luacheck) only runs once instead
# of once per OS in the test matrix.

jobs:
  lint:
    name: lint
    # See the workflow header: a v* tag builds the releases only.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        # no submodules: luacheck only looks at src/, not vendor/exiftool

      # luacheck cannot be *run* under a genuine Lua 5.5 interpreter:
      # luacheck/standards.lua reassigns a generic-for loop variable
      # (`field_name = field_def`), and Lua 5.5 makes for-in loop variables
      # implicitly <const> ("attempt to assign to const variable
      # 'field_name'"). So the linter is hosted on its own Lua 5.1;
      # everything project-related runs under Lua 5.5, in the `test` job
      # below.
      - name: install Lua 5.1 (luacheck host only, see above)
        uses: luarocks/gh-actions-lua@v14
        with:
          luaVersion: "5.1"

      - uses: luarocks/gh-actions-luarocks@v7

      - name: install luacheck
        run: luarocks install luacheck

      - name: lint
        run: luacheck src

  test:
    name: test (${{ matrix.os }})
    # See the workflow header: a v* tag builds the releases only.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: disable autocrlf (Windows)
        # windows-latest's git defaults to core.autocrlf=true, rewriting
        # LF to CRLF in every text file it checks out (including inside
        # the vendor/exiftool submodule) -- actions/checkout does not
        # touch this itself. Several vendored test fixtures are newline-
        # or byte-sensitive (e.g. t/images/Text1.txt, whose expected
        # output literally is "Newlines: Unix LF"), so this must be unset
        # before the checkout below, not after.
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: true   # vendor/exiftool/t: test images and the
                             # expected .out files

      - uses: ./.github/actions/msvc-dev-env
        if: runner.os == 'Windows'

      - name: remove conflicting Git link.exe (Windows)
        # Git for Windows ships a coreutils "link" (hardlink tool) in usr/bin
        # that shadows MSVC's link.exe under the bash shell used below.
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f "/usr/bin/link.exe"

      - name: install GNU make (Windows)
        # windows-latest has no POSIX make by default, and the project's
        # Makefile is written against GNU make.
        # If choco cannot provide it, this is meant to fail loudly here
        # rather than have a later step silently do nothing.
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: install C libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential libpcre2-dev libbrotli-dev zlib1g-dev liblzma-dev libbz2-dev perl locales
          # the unit tests run under de_DE (src/runtests.lua): decimal comma
          # and a collation of its own; macOS ships it, Windows' UCRT knows
          # it as de-DE. de_DE (ISO-8859-1) is the single-byte run below.
          sudo locale-gen de_DE.UTF-8 de_DE

      - name: install C libraries (macOS)
        # perl ships with macOS already; zlib comes from Homebrew (below).
        if: runner.os == 'macOS'
        run: |
          brew install pcre2 brotli zlib xz bzip2
          echo "PCRE2_DIR=$(brew --prefix pcre2)" >> "$GITHUB_ENV"
          echo "BROTLI_DIR=$(brew --prefix brotli)" >> "$GITHUB_ENV"
          # compress.zlib against Homebrew's current zlib rather than the
          # SDK's older one (Perl's Compress::Raw::Zlib bundles a current
          # zlib), for byte-identical deflate output
          echo "ZLIB_DIR=$(brew --prefix zlib)" >> "$GITHUB_ENV"
          # compress.lzma/compress.bzip2: liblzma and libbz2 from Homebrew
          # (bzip2 is keg-only there)
          echo "LZMA_DIR=$(brew --prefix xz)" >> "$GITHUB_ENV"
          echo "BZIP2_DIR=$(brew --prefix bzip2)" >> "$GITHUB_ENV"

      - name: install C libraries (Windows)
        # Perl ships with windows-latest (Strawberry Perl), the TEST_PERL of
        # the facade's localtime/gmtime comparisons.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # (pcre2 without its default "jit" feature: the regex facade never
          # asks for JIT, and the feature's sljit lookup goes through the
          # rate-limited GitHub API)
          vcpkg install "pcre2[core]:x64-windows" brotli:x64-windows zlib:x64-windows liblzma:x64-windows bzip2:x64-windows
          echo "PCRE2_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"
          echo "BROTLI_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"
          echo "ZLIB_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"
          echo "LZMA_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"
          echo "BZIP2_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"
          echo "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"
          # the compress.zlib rockspec links "zlib.lib"; zlib's own
          # CMakeLists.txt (which the vcpkg port calls through) names the
          # import library "z.lib", "libz.lib" or "zlib.lib" depending on the release
          # -- copy it under the rockspec's name where needed
          zlib_lib="$VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib"
          if [ ! -f "$zlib_lib/zlib.lib" ]; then
            if [ -f "$zlib_lib/z.lib" ]; then
              cp "$zlib_lib/z.lib" "$zlib_lib/zlib.lib"
            elif [ -f "$zlib_lib/libz.lib" ]; then
              cp "$zlib_lib/libz.lib" "$zlib_lib/zlib.lib"
            else
              echo "no zlib import library in $zlib_lib:" >&2; ls "$zlib_lib"/*.lib >&2; exit 1
            fi
          fi
          # the compress.lzma rockspec links lzma.lib, the import library of
          # XZ Utils 5.6.3 and later; older vcpkg ports name it liblzma.lib
          lib="$VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib"
          if [ ! -f "$lib/lzma.lib" ] && [ -f "$lib/liblzma.lib" ]; then
            cp "$lib/liblzma.lib" "$lib/lzma.lib"
          fi


      - name: Compress::Raw::Lzma for the reference Perl (Windows)
        if: runner.os == 'Windows'
        # After the vcpkg step: Strawberry's gcc has no liblzma, so the module
        # is built against vcpkg's lzma.h and liblzma.dll, through a gcc import
        # library made with Strawberry's gendef/dlltool (MakeMaker's Liblist
        # looks for liblzma.a / liblzma.dll.a). The DLL is on PATH
        # (GITHUB_PATH above) when the reference runs. Under cmd with
        # Strawberry's toolchain first, as for the other Perl modules.
        shell: cmd
        env:
          CC: gcc
          CXX: g++
        run: |
          set PATH=C:\Strawberry\c\bin;C:\Strawberry\perl\site\bin;C:\Strawberry\perl\bin;%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\bin;%PATH%
          set LIBLZMA_INCLUDE=%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\include
          mkdir %RUNNER_TEMP%\lzma-gcc
          cd /d %RUNNER_TEMP%\lzma-gcc
          gendef %VCPKG_INSTALLATION_ROOT%\installed\x64-windows\bin\liblzma.dll || exit /b 1
          dlltool -d liblzma.def -D liblzma.dll -l liblzma.dll.a || exit /b 1
          copy liblzma.dll.a liblzma.a
          set LIBLZMA_LIB=%RUNNER_TEMP%\lzma-gcc
          C:\Strawberry\perl\bin\perl.exe C:\Strawberry\perl\bin\cpanm --notest Compress::Raw::Lzma || (type %USERPROFILE%\.cpanm\build.log & exit /b 1)
          C:\Strawberry\perl\bin\perl.exe -MCompress::Raw::Lzma -e "print Compress::Raw::Lzma::lzma_version_string(), qq(\n)"
      - name: install Lua 5.5 (the project's only supported version)
        uses: luarocks/gh-actions-lua@v14
        with:
          luaVersion: "5.5"

      - uses: luarocks/gh-actions-luarocks@v7

      - name: install Lua rocks (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          luarocks install carray
          if [ -n "$PCRE2_DIR" ]; then
            luarocks install lpcre PCRE2_DIR="$PCRE2_DIR"
          else
            luarocks install lpcre
          fi
          if [ -n "$BROTLI_DIR" ]; then
            luarocks install compress.brotli BROTLIDEC_DIR="$BROTLI_DIR" BROTLIENC_DIR="$BROTLI_DIR"
          else
            luarocks install compress.brotli
          fi
          luarocks install luafilesystem
          luarocks install digest
          luarocks install cipher.aes
          luarocks install cipher.rc4
          if [ -n "$ZLIB_DIR" ]; then
            luarocks install compress.zlib ZLIB_DIR="$ZLIB_DIR"
          else
            luarocks install compress.zlib
          fi
          if [ -n "$LZMA_DIR" ]; then
            luarocks install compress.lzma LZMA_DIR="$LZMA_DIR"
          else
            luarocks install compress.lzma
          fi
          if [ -n "$BZIP2_DIR" ]; then
            luarocks install compress.bzip2 BZIP2_DIR="$BZIP2_DIR"
          else
            luarocks install compress.bzip2
          fi

      - name: install Lua rocks (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          luarocks install carray
          luarocks install lpcre PCRE2_DIR="$PCRE2_DIR"
          luarocks install compress.brotli BROTLIDEC_DIR="$BROTLI_DIR" BROTLIENC_DIR="$BROTLI_DIR"
          luarocks install luafilesystem
          luarocks install digest
          luarocks install cipher.aes
          luarocks install cipher.rc4
          luarocks install compress.zlib ZLIB_DIR="$ZLIB_DIR"
          luarocks install compress.lzma LZMA_DIR="$LZMA_DIR"
          luarocks install compress.bzip2 BZIP2_DIR="$BZIP2_DIR"

      - name: build lexiftool.sys (Linux/macOS)
        # `make sys` (and `make check`) also target Lua 5.4 -- not installed
        # here on purpose (Lua 5.5 only) -- so only the 5.5 target is built.
        # LUA_INCDIR_5.5 comes from luarocks' own config instead of guessing
        # pkg-config names or standard include directories, since gh-actions-lua
        # does not install into any of those.
        if: runner.os != 'Windows'
        shell: bash
        run: make sys5.5 LUA_INCDIR_5.5="$(luarocks config variables.LUA_INCDIR)"

      - name: build lexiftool (Windows)
        # The Makefile's sys5.5 pattern rule drives $(CC)/pkg-config directly,
        # which is brittle to reproduce for MSVC from git-bash. `luarocks make`
        # is the build path the rockspec itself defines (sys.c plus all Lua
        # modules) and already knows how to find the Lua headers/libs that
        # gh-actions-luarocks configured it for.
        if: runner.os == 'Windows'
        shell: bash
        run: luarocks make rockspecs/lexiftool-scm-0.rockspec

      - name: test
        # Equivalent to `make test5.5`, but LUA_PATH/LUA_CPATH are built from
        # `luarocks path` instead of the Makefile's LUA_ROCKS guess
        # ($HOME/.luarocks): gh-actions-lua/gh-actions-luarocks may install
        # the rocks tree elsewhere, especially on Windows. The Lua binary
        # name is also not assumed: distro packages call it lua5.5, but
        # gh-actions-lua's own from-source builds expose plain `lua`
        # (lua.exe on Windows). The runner sets a de_DE locale itself (the
        # first of de_DE.UTF-8, de_DE.utf8, de-DE, German_Germany.1252 the C
        # library accepts; on Windows German_Germany.1252 comes first, so
        # that run covers a single-byte LC_CTYPE) and reports it in its
        # first line;
        # LEXIFTOOL_TEST_LOCALE_REQUIRED (= make's TEST_LOCALE_REQUIRED=1)
        # makes a missing one fail the job instead of running under "C".
        # LEXIFTOOL_TEST_PERL (= make's TEST_PERL) names the Perl whose
        # localtime/gmtime the facade's are compared with: on Windows
        # Strawberry Perl, the native build -- the perl on Git Bash's PATH
        # is an msys one, with a localtime range of its own.
        shell: bash
        run: |
          set -e
          LUA_BIN=$(command -v lua5.5 || command -v lua)
          export LUA_PATH="./src/?.lua;./src/?/init.lua;$(luarocks path --lr-path)"
          export LUA_CPATH="./build/5.5/?.so;./?.so;$(luarocks path --lr-cpath)"
          unset LUA_PATH_5_5 LUA_CPATH_5_5
          TEST_PERL=perl
          if [ "$RUNNER_OS" = Windows ]; then TEST_PERL=C:/Strawberry/perl/bin/perl.exe; fi
          "$LUA_BIN" -e "LEXIFTOOL_TEST_LOCALE_REQUIRED=1" -e "LEXIFTOOL_TEST_PERL='$TEST_PERL'" src/runtests.lua

      - name: test (single-byte locale)
        # The suite once more under glibc's de_DE (ISO-8859-1), where Lua's
        # pattern classes (%a, %w, ...) and string.lower/upper take 0xE4 for
        # a letter -- the case Windows covers with cp1252. macOS stays UTF-8.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          LUA_BIN=$(command -v lua5.5 || command -v lua)
          export LUA_PATH="./src/?.lua;./src/?/init.lua;$(luarocks path --lr-path)"
          export LUA_CPATH="./build/5.5/?.so;./?.so;$(luarocks path --lr-cpath)"
          unset LUA_PATH_5_5 LUA_CPATH_5_5
          "$LUA_BIN" -e "LEXIFTOOL_TEST_LOCALE='de_DE'" -e "LEXIFTOOL_TEST_LOCALE_REQUIRED=1" src/runtests.lua

  # CLI golden comparison: the Perl original builds the reference tree, then
  # runs against it (must be 100% -- this validates the harness and its
  # determinism), and lexiftool runs against the same tree (must be 100% as
  # well: the port is held to the original on every platform). The
  # reference is generated per OS and never committed: paths, locale, birth
  # times and ctime all differ between platforms, so "determinism is created,
  # not normalised" (src/test-cli/Driver.lua).
  cli-golden:
    name: cli-golden (${{ matrix.os }})
    # See the workflow header: the reference run is too expensive for every
    # PR, and a v* tag builds the releases only.
    if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: disable autocrlf (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: CMake 3 for Alien::cmake3
        # IO::Compress::Brotli builds through Alien::cmake3, which takes
        # only a cmake 3.x; the runners carry 4.x, so it would download one
        # from cmake.org, which does not always answer the runners. A cmake
        # 3 from PyPI instead: only its binary goes into PATH, not the
        # Python of its venv. (Linux: part of the perl-exiftool action.)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" -m venv "$RUNNER_TEMP/cmake3"
          vpy="$RUNNER_TEMP/cmake3/bin/python"
          [ -x "$vpy" ] || vpy="$RUNNER_TEMP/cmake3/Scripts/python.exe"
          "$vpy" -m pip install --quiet --disable-pip-version-check "cmake>=3.16,<4"
          bin=$("$vpy" -c "import cmake, os; print(os.path.join(os.path.dirname(cmake.__file__), 'data', 'bin'))")
          "$bin/cmake" --version
          if command -v cygpath > /dev/null 2>&1; then bin=$(cygpath -w "$bin"); fi
          echo "$bin" >> "$GITHUB_PATH"

      - name: install optional Perl modules (Windows)
        if: runner.os == 'Windows'
        # Before msvc-dev-env: with MSVC's cl in the environment, CMake built
        # brotli as .lib files while IO::Compress::Brotli's Makefile.PL links
        # the MinGW .a names. Strawberry's own gcc is what both expect.
        # Under cmd, not bash: the generated makefile runs pl2bat.bat (a
        # batch file) for the module's helper script, which only cmd can
        # execute. Strawberry's Perl is named explicitly, since Git Bash's
        # msys Perl would otherwise come first in PATH.
        shell: cmd
        env:
          CC: gcc
          CXX: g++
        run: |
          C:\Strawberry\perl\bin\perl.exe C:\Strawberry\perl\bin\cpanm --notest Win32::API IO::String IO::Compress::Brotli Unicode::LineBreak || (type %USERPROFILE%\.cpanm\build.log & exit /b 1)
          rem The reference must be built by Strawberry's Perl, not by the msys
          rem Perl that Git Bash puts first in PATH: that one reports as a
          rem POSIX system ($^O eq 'msys', FileInodeChangeDate, rwx modes).
          echo TEST_CLI_PERL=C:/Strawberry/perl/bin/perl.exe>> %GITHUB_ENV%

      - uses: ./.github/actions/msvc-dev-env
        if: runner.os == 'Windows'

      - name: remove conflicting Git link.exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f "/usr/bin/link.exe"

      - name: install GNU make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: C libraries and the Perl original with its optional modules (Linux)
        # The reference must have the feature set of a full exiftool install;
        # the action says which modules and why, and caches the CPAN ones.
        if: runner.os == 'Linux'
        uses: ./.github/actions/perl-exiftool

      - name: install C libraries and Perl (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pcre2 brotli zlib xz bzip2 perl cpanminus
          echo "PCRE2_DIR=$(brew --prefix pcre2)" >> "$GITHUB_ENV"
          echo "BROTLI_DIR=$(brew --prefix brotli)" >> "$GITHUB_ENV"
          # compress.zlib against Homebrew's current zlib rather than the
          # SDK's older one (Perl's Compress::Raw::Zlib bundles a current
          # zlib), for byte-identical deflate output
          echo "ZLIB_DIR=$(brew --prefix zlib)" >> "$GITHUB_ENV"
          # compress.lzma/compress.bzip2: liblzma and libbz2 from Homebrew
          # (bzip2 is keg-only there)
          echo "LZMA_DIR=$(brew --prefix xz)" >> "$GITHUB_ENV"
          echo "BZIP2_DIR=$(brew --prefix bzip2)" >> "$GITHUB_ENV"
          # SIP strips DYLD_* from /usr/bin/perl, so the ctime interposer needs
          # a Homebrew Perl (see tools/ctime_fake_darwin.c); cpanm then adds
          # the optional modules below to it.
          echo "TEST_CLI_PERL=$(brew --prefix perl)/bin/perl" >> "$GITHUB_ENV"
          # Same optional modules as on Linux (Homebrew's cpanm belongs to
          # Homebrew's Perl); File::StatX is Linux-only.
          cpanm --notest Archive::Zip IO::String Term::ReadKey Unicode::LineBreak
          # IO::Compress::Brotli drags in Alien::cmake3 -> Alien::Build ->
          # IO::Socket::SSL -> Net::SSLeay, which needs to be told where
          # Homebrew's OpenSSL is; brotli itself comes from Homebrew.
          OPENSSL_PREFIX="$(brew --prefix openssl@3)" cpanm --notest Net::SSLeay
          BROTLI_INCLUDE="$(brew --prefix brotli)/include" BROTLI_LIB="$(brew --prefix brotli)/lib" \
            cpanm --notest IO::Compress::Brotli
          # Compress::Raw::Lzma (encoded 7z headers) against Homebrew's xz
          LIBLZMA_INCLUDE="$(brew --prefix xz)/include" LIBLZMA_LIB="$(brew --prefix xz)/lib" \
            cpanm --notest Compress::Raw::Lzma

      - name: install C libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # (pcre2 without its default "jit" feature: the regex facade never
          # asks for JIT, and the feature's sljit lookup goes through the
          # rate-limited GitHub API)
          vcpkg install "pcre2[core]:x64-windows" brotli:x64-windows zlib:x64-windows liblzma:x64-windows bzip2:x64-windows
          echo "PCRE2_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"
          echo "BROTLI_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"
          echo "ZLIB_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"
          echo "LZMA_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"
          echo "BZIP2_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"
          echo "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"
          zlib_lib="$VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib"
          if [ ! -f "$zlib_lib/zlib.lib" ]; then
            if [ -f "$zlib_lib/z.lib" ]; then
              cp "$zlib_lib/z.lib" "$zlib_lib/zlib.lib"
            elif [ -f "$zlib_lib/libz.lib" ]; then
              cp "$zlib_lib/libz.lib" "$zlib_lib/zlib.lib"
            else
              echo "no zlib import library in $zlib_lib:" >&2; ls "$zlib_lib"/*.lib >&2; exit 1
            fi
          fi
          # the compress.lzma rockspec links lzma.lib, the import library of
          # XZ Utils 5.6.3 and later; older vcpkg ports name it liblzma.lib
          lib="$VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib"
          if [ ! -f "$lib/lzma.lib" ] && [ -f "$lib/liblzma.lib" ]; then
            cp "$lib/liblzma.lib" "$lib/lzma.lib"
          fi

      - name: install Lua 5.5
        uses: luarocks/gh-actions-lua@v14
        with:
          luaVersion: "5.5"

      - uses: luarocks/gh-actions-luarocks@v7

      - name: install Lua rocks (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          luarocks install carray
          if [ -n "$PCRE2_DIR" ]; then
            luarocks install lpcre PCRE2_DIR="$PCRE2_DIR"
          else
            luarocks install lpcre
          fi
          if [ -n "$BROTLI_DIR" ]; then
            luarocks install compress.brotli BROTLIDEC_DIR="$BROTLI_DIR" BROTLIENC_DIR="$BROTLI_DIR"
          else
            luarocks install compress.brotli
          fi
          luarocks install luafilesystem
          luarocks install digest
          luarocks install cipher.aes
          luarocks install cipher.rc4
          if [ -n "$ZLIB_DIR" ]; then
            luarocks install compress.zlib ZLIB_DIR="$ZLIB_DIR"
          else
            luarocks install compress.zlib
          fi
          if [ -n "$LZMA_DIR" ]; then
            luarocks install compress.lzma LZMA_DIR="$LZMA_DIR"
          else
            luarocks install compress.lzma
          fi
          if [ -n "$BZIP2_DIR" ]; then
            luarocks install compress.bzip2 BZIP2_DIR="$BZIP2_DIR"
          else
            luarocks install compress.bzip2
          fi

      - name: install Lua rocks (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          luarocks install carray
          luarocks install lpcre PCRE2_DIR="$PCRE2_DIR"
          luarocks install compress.brotli BROTLIDEC_DIR="$BROTLI_DIR" BROTLIENC_DIR="$BROTLI_DIR"
          luarocks install luafilesystem
          luarocks install digest
          luarocks install cipher.aes
          luarocks install cipher.rc4
          luarocks install compress.zlib ZLIB_DIR="$ZLIB_DIR"
          luarocks install compress.lzma LZMA_DIR="$LZMA_DIR"
          luarocks install compress.bzip2 BZIP2_DIR="$BZIP2_DIR"

      - name: build the port (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          make sys5.5 LUA_INCDIR_5.5="$(luarocks config variables.LUA_INCDIR)"
          make bytecode5.5 LUAC5_5="$(command -v luac5.5 || command -v luac)"

      - name: build the port (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: luarocks make rockspecs/lexiftool-scm-0.rockspec

      - name: build the Perl reference tree
        shell: bash
        run: |
          set -e
          LUA_BIN=$(command -v lua5.5 || command -v lua)
          if [ "$RUNNER_OS" = "Windows" ]; then
            LUA_BIN=$(cygpath -m "$LUA_BIN")   # Windows path with forward slashes: survives the Makefile's shell
          fi
          make test-cli-gen \
            TEST_CLI_LUA="$LUA_BIN" \
            TEST_CLI_ROCKS_VER=5.5 \
            TEST_CLI_JOBS=auto \
            TEST_CLI_LUA_PATH="./src/?.lua;./src/?/init.lua;$(luarocks path --lr-path)" \
            TEST_CLI_LUA_CPATH="./build/5.5/?.so;./?.so;$(luarocks path --lr-cpath)" \
            LUA_INCDIR_5.5="$(luarocks config variables.LUA_INCDIR)"

      - name: Perl against its own reference (must be 100%)
        shell: bash
        run: |
          LUA_BIN=$(command -v lua5.5 || command -v lua)
          if [ "$RUNNER_OS" = "Windows" ]; then
            LUA_BIN=$(cygpath -m "$LUA_BIN")   # Windows path with forward slashes: survives the Makefile's shell
          fi
          make test-cli-perl \
            TEST_CLI_LUA="$LUA_BIN" \
            TEST_CLI_ROCKS_VER=5.5 \
            TEST_CLI_JOBS=auto \
            TEST_CLI_LUA_PATH="./src/?.lua;./src/?/init.lua;$(luarocks path --lr-path)" \
            TEST_CLI_LUA_CPATH="./build/5.5/?.so;./?.so;$(luarocks path --lr-cpath)" \
            LUA_INCDIR_5.5="$(luarocks config variables.LUA_INCDIR)"

      - name: lexiftool against the reference (must be 100%)
        # Any difference between lexiftool and exiftool fails this step
        # (TEST_CLI_EXPECT_IDENTICAL): a regression of the port must not hide
        # behind a green job. The report in the artifact names the cases.
        shell: bash
        run: |
          LUA_BIN=$(command -v lua5.5 || command -v lua)
          if [ "$RUNNER_OS" = "Windows" ]; then
            LUA_BIN=$(cygpath -m "$LUA_BIN")   # Windows path with forward slashes: survives the Makefile's shell
          fi
          make test-cli-lua \
            TEST_CLI_EXPECT_IDENTICAL=1 \
            TEST_CLI_LUA="$LUA_BIN" \
            LUAC5_5="$(command -v luac5.5 || command -v luac)" \
            TEST_CLI_ROCKS_VER=5.5 \
            TEST_CLI_JOBS=auto \
            TEST_CLI_LUA_PATH="./src/?.lua;./src/?/init.lua;$(luarocks path --lr-path)" \
            TEST_CLI_LUA_CPATH="./build/5.5/?.so;./?.so;$(luarocks path --lr-cpath)" \
            LUA_INCDIR_5.5="$(luarocks config variables.LUA_INCDIR)"

      - name: collect the differences
        # The report names the differing cases; the first lines of each
        # case's diff are what a reader needs to see without downloading the
        # trees, which are generated per OS and too large to keep.
        if: always()
        shell: bash
        run: |
          if [ -f test-cli-out/failures.txt ]; then
            cut -f5 test-cli-out/failures.txt | sort -u | while read -r c; do
              echo "=== $c"
              # diff exits 1 for "differs", the expected case here; 2 (a
              # missing tree) is a real error and fails the step. The output
              # goes to a file first: cutting a pipe with head would kill diff
              # with SIGPIPE and fail the step under pipefail.
              rc=0
              diff -r "test-cli-ref/$c" "test-cli-out/$c" > test-cli-out/.diff || rc=$?
              [ "$rc" -le 1 ] || exit "$rc"
              head -40 test-cli-out/.diff
            done > test-cli-out/diffs.txt
            rm -f test-cli-out/.diff
          fi

      - name: upload the comparison report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-golden-${{ matrix.os }}-${{ github.sha }}
          path: |
            test-cli-out/summary.txt
            test-cli-out/failures.txt
            test-cli-out/results.json
            test-cli-out/diffs.txt
            build/test-cli/worker-*.err
          if-no-files-found: warn

  # C API (capi/, doc/capi.md), the "rock" variant -- the library only,
  # Lua and the C modules from this job's Lua 5.5 and rocks, as in the test
  # job -- on every OS: test_capi, test_threads, test_sideeffects, and
  # lexiftool_image_info against Perl's Image::ExifTool (capi/info_dump.pl,
  # all of t/images, several option sets; capi/compare-perl.sh). The Perl
  # needs the optional modules of a full exiftool installation, as the
  # cli-golden reference does. The embedded libraries (built in the
  # standalone builder containers) and the ThreadSanitizer runs are the
  # manual workflow capi.yml, to be run before a release.
  capi:
    name: capi (${{ matrix.os }})
    # As cli-golden: not for pull requests, not for a release tag.
    if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: disable autocrlf (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: true   # vendor/exiftool: t/images and the Perl library

      - name: CMake 3 for Alien::cmake3
        # IO::Compress::Brotli builds through Alien::cmake3, which takes
        # only a cmake 3.x; the runners carry 4.x, so it would download one
        # from cmake.org, which does not always answer the runners. A cmake
        # 3 from PyPI instead: only its binary goes into PATH, not the
        # Python of its venv. (Linux: part of the perl-exiftool action.)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" -m venv "$RUNNER_TEMP/cmake3"
          vpy="$RUNNER_TEMP/cmake3/bin/python"
          [ -x "$vpy" ] || vpy="$RUNNER_TEMP/cmake3/Scripts/python.exe"
          "$vpy" -m pip install --quiet --disable-pip-version-check "cmake>=3.16,<4"
          bin=$("$vpy" -c "import cmake, os; print(os.path.join(os.path.dirname(cmake.__file__), 'data', 'bin'))")
          "$bin/cmake" --version
          if command -v cygpath > /dev/null 2>&1; then bin=$(cygpath -w "$bin"); fi
          echo "$bin" >> "$GITHUB_PATH"

      - name: install optional Perl modules (Windows)
        # As in cli-golden: before msvc-dev-env, under cmd, Strawberry's Perl
        # named explicitly (Git Bash's msys Perl comes first in PATH).
        if: runner.os == 'Windows'
        shell: cmd
        env:
          CC: gcc
          CXX: g++
        run: |
          C:\Strawberry\perl\bin\perl.exe C:\Strawberry\perl\bin\cpanm --notest Win32::API IO::String IO::Compress::Brotli Unicode::LineBreak || (type %USERPROFILE%\.cpanm\build.log & exit /b 1)
          echo CAPI_PERL=C:/Strawberry/perl/bin/perl.exe>> %GITHUB_ENV%

      - uses: ./.github/actions/msvc-dev-env
        if: runner.os == 'Windows'

      - name: remove conflicting Git link.exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f "/usr/bin/link.exe"

      - name: C libraries and the Perl original with its optional modules (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/perl-exiftool

      - name: the reference Perl (Linux)
        if: runner.os == 'Linux'
        run: echo "CAPI_PERL=perl" >> "$GITHUB_ENV"

      - name: install C libraries and Perl (macOS)
        # As in cli-golden: Homebrew's Perl with the optional modules.
        if: runner.os == 'macOS'
        run: |
          brew install pcre2 brotli zlib xz bzip2 perl cpanminus
          echo "PCRE2_DIR=$(brew --prefix pcre2)" >> "$GITHUB_ENV"
          echo "BROTLI_DIR=$(brew --prefix brotli)" >> "$GITHUB_ENV"
          echo "ZLIB_DIR=$(brew --prefix zlib)" >> "$GITHUB_ENV"
          echo "LZMA_DIR=$(brew --prefix xz)" >> "$GITHUB_ENV"
          echo "BZIP2_DIR=$(brew --prefix bzip2)" >> "$GITHUB_ENV"
          echo "CAPI_PERL=$(brew --prefix perl)/bin/perl" >> "$GITHUB_ENV"
          cpanm --notest Archive::Zip IO::String Term::ReadKey Unicode::LineBreak
          OPENSSL_PREFIX="$(brew --prefix openssl@3)" cpanm --notest Net::SSLeay
          BROTLI_INCLUDE="$(brew --prefix brotli)/include" BROTLI_LIB="$(brew --prefix brotli)/lib" \
            cpanm --notest IO::Compress::Brotli
          LIBLZMA_INCLUDE="$(brew --prefix xz)/include" LIBLZMA_LIB="$(brew --prefix xz)/lib" \
            cpanm --notest Compress::Raw::Lzma

      - name: install C libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # (pcre2 without its default "jit" feature: the regex facade never
          # asks for JIT, and the feature's sljit lookup goes through the
          # rate-limited GitHub API)
          vcpkg install "pcre2[core]:x64-windows" brotli:x64-windows zlib:x64-windows liblzma:x64-windows bzip2:x64-windows
          echo "PCRE2_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"
          echo "BROTLI_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"
          echo "ZLIB_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"
          echo "LZMA_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"
          echo "BZIP2_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"
          echo "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"
          lib="$VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib"
          # (the zlib import library is "z.lib", "libz.lib" or "zlib.lib"
          #  depending on the release; the rockspecs link zlib.lib)
          if [ ! -f "$lib/zlib.lib" ]; then
            if [ -f "$lib/z.lib" ]; then
              cp "$lib/z.lib" "$lib/zlib.lib"
            elif [ -f "$lib/libz.lib" ]; then
              cp "$lib/libz.lib" "$lib/zlib.lib"
            else
              echo "no zlib import library in $lib:" >&2; ls "$lib"/*.lib >&2; exit 1
            fi
          fi
          if [ ! -f "$lib/lzma.lib" ] && [ -f "$lib/liblzma.lib" ]; then
            cp "$lib/liblzma.lib" "$lib/lzma.lib"
          fi

      - name: Compress::Raw::Lzma for the reference Perl (Windows)
        # As in the test job (after the vcpkg step).
        if: runner.os == 'Windows'
        shell: cmd
        env:
          CC: gcc
          CXX: g++
        run: |
          set PATH=C:\Strawberry\c\bin;C:\Strawberry\perl\site\bin;C:\Strawberry\perl\bin;%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\bin;%PATH%
          set LIBLZMA_INCLUDE=%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\include
          mkdir %RUNNER_TEMP%\lzma-gcc
          cd /d %RUNNER_TEMP%\lzma-gcc
          gendef %VCPKG_INSTALLATION_ROOT%\installed\x64-windows\bin\liblzma.dll || exit /b 1
          dlltool -d liblzma.def -D liblzma.dll -l liblzma.dll.a || exit /b 1
          copy liblzma.dll.a liblzma.a
          set LIBLZMA_LIB=%RUNNER_TEMP%\lzma-gcc
          C:\Strawberry\perl\bin\perl.exe C:\Strawberry\perl\bin\cpanm --notest Compress::Raw::Lzma || (type %USERPROFILE%\.cpanm\build.log & exit /b 1)

      - name: install Lua 5.5
        uses: luarocks/gh-actions-lua@v14
        with:
          luaVersion: "5.5"

      - uses: luarocks/gh-actions-luarocks@v7

      - name: install Lua rocks (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          luarocks install carray
          luarocks install lpcre ${PCRE2_DIR:+PCRE2_DIR="$PCRE2_DIR"}
          luarocks install compress.brotli ${BROTLI_DIR:+BROTLIDEC_DIR="$BROTLI_DIR" BROTLIENC_DIR="$BROTLI_DIR"}
          luarocks install luafilesystem
          luarocks install digest
          luarocks install cipher.aes
          luarocks install cipher.rc4
          luarocks install compress.zlib ${ZLIB_DIR:+ZLIB_DIR="$ZLIB_DIR"}
          luarocks install compress.lzma ${LZMA_DIR:+LZMA_DIR="$LZMA_DIR"}
          luarocks install compress.bzip2 ${BZIP2_DIR:+BZIP2_DIR="$BZIP2_DIR"}

      - name: install Lua rocks (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          luarocks install carray
          luarocks install lpcre PCRE2_DIR="$PCRE2_DIR"
          luarocks install compress.brotli BROTLIDEC_DIR="$BROTLI_DIR" BROTLIENC_DIR="$BROTLI_DIR"
          luarocks install luafilesystem
          luarocks install digest
          luarocks install cipher.aes
          luarocks install cipher.rc4
          luarocks install compress.zlib ZLIB_DIR="$ZLIB_DIR"
          luarocks install compress.lzma LZMA_DIR="$LZMA_DIR"
          luarocks install compress.bzip2 BZIP2_DIR="$BZIP2_DIR"

      - name: build lexiftool.sys (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: make sys5.5 LUA_INCDIR_5.5="$(luarocks config variables.LUA_INCDIR)"

      - name: build lexiftool.sys (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: luarocks make rockspecs/lexiftool-scm-0.rockspec

      - name: build the C API (rock)
        # Against the Lua of gh-actions-lua: its headers and library (a
        # static one is linked whole, its symbols exported for the C
        # modules); Windows with MSVC's cl.
        shell: bash
        run: |
          set -e
          lua=$(command -v lua5.5 || command -v lua)
          case "$RUNNER_OS" in
            Linux)
              libdir=$(luarocks config variables.LUA_LIBDIR)
              # the first liblua there, static preferred (no ls: under
              # bash's pipefail an unmatched pattern would end the step)
              lib=
              for f in "$libdir"/liblua5.5.a "$libdir"/liblua.a "$libdir"/liblua5.5.so "$libdir"/liblua.so; do
                  if [ -z "$lib" ] && [ -f "$f" ]; then lib=$f; fi
              done
              [ -n "$lib" ] || { echo "no liblua in $libdir:" >&2; ls -l "$libdir" >&2; exit 1; }
              CAPI_LUA="$lua" CAPI_LUA_INCDIR="$(luarocks config variables.LUA_INCDIR)" CAPI_LUA_LIB="$lib" \
                sh capi/build-linux.sh rock ;;
            macOS)   CAPI_LUA="$lua" sh capi/build-macos.sh rock ;;
            Windows) CAPI_LUA="$lua" sh capi/build-windows.sh rock ;;
          esac

      - name: test the C API (test_capi, test_threads, test_sideeffects, Perl comparison)
        # The modules as the test job finds them, with absolute paths
        # (test_sideeffects changes its working directory). Linux: also the
        # ASan/LSan build.
        shell: bash
        run: |
          set -e
          root=$PWD
          [ "$RUNNER_OS" = Windows ] && root=$(cygpath -m "$PWD")
          export LUA_PATH_5_5="$root/src/?.lua;$root/src/?/init.lua;$(luarocks path --lr-path)"
          export LUA_CPATH_5_5="$root/build/5.5/?.so;$(luarocks path --lr-cpath)"
          case "$RUNNER_OS" in
            Linux)   status=0
                     sh capi/build-linux.sh test || status=1
                     sh capi/build-linux.sh sideeffects || status=1
                     exit $status ;;
            macOS)   sh capi/build-macos.sh test ;;
            Windows) sh capi/build-windows.sh test ;;
          esac

      - name: upload the test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: capi-${{ matrix.os }}-${{ github.sha }}
          path: |
            capi/build/test*/
          if-no-files-found: warn

  # Standalone executables (see standalone/README.md): built with podman on
  # an ubuntu runner, rebuilt in a fresh container to prove the build is
  # reproducible, smoke-tested and uploaded as a run artifact; the
  # publishing jobs at the end attach them to the latest-dev pre-release or
  # the release. One matrix job, one entry per platform in the UI; the
  # platform-specific steps are selected with `if`.
  #
  # Not run for pull requests: the builds take up to an hour each and are
  # not a PR gate.
  standalone:
    name: standalone (${{ matrix.platform }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            exe: lexiftool
          - platform: macos
            exe: lexiftool
          - platform: windows
            exe: lexiftool.exe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true    # vendor/exiftool: test images for the smoke test
          fetch-depth: 0      # full history + tags: the Makefile's SA_IDENTITY (git describe) needs both

      - name: Build
        run: make ${{ matrix.platform }}

      - name: Verify the build is reproducible
        run: |
          # rebuild in a fresh container; executable and zip must not change
          dist=dist-${{ matrix.platform }}
          h1=$(sha256sum "$dist/${{ matrix.exe }}" "$dist"/*.zip)
          rm -rf build/standalone "$dist"
          make ${{ matrix.platform }} >/dev/null
          h2=$(sha256sum "$dist/${{ matrix.exe }}" "$dist"/*.zip)
          echo "run1: $h1"
          echo "run2: $h2"
          test "$h1" = "$h2"

      - name: Check the universal binary (macOS)
        if: matrix.platform == 'macos'
        run: |
          file dist-macos/lexiftool
          file dist-macos/lexiftool | grep -q "Mach-O universal binary with 2 architectures"

      - name: Smoke test (native Linux)
        if: matrix.platform == 'linux'
        run: sh standalone/smoke.sh dist-linux/lexiftool

      - name: Smoke test (wine)
        if: matrix.platform == 'windows'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine wine64
          WINEDEBUG=-all sh standalone/smoke.sh wine dist-windows/lexiftool.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lexiftool-${{ matrix.platform }}-${{ github.sha }}
          path: dist-${{ matrix.platform }}/*.zip
          if-no-files-found: error

  # The cross build cannot run Mach-O binaries on Linux: the functional test
  # runs on a macOS runner (arm64 natively, the Intel slice via Rosetta).
  macos-smoke:
    name: macOS smoke
    needs: standalone
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/download-artifact@v8
        with:
          name: lexiftool-macos-${{ github.sha }}
          path: zip

      - name: Smoke test (arm64)
        run: |
          unzip -o zip/*.zip -d zip
          exe=$(ls zip/lexiftool-macos-*/lexiftool)
          file "$exe"
          sh standalone/smoke.sh "$exe"

      - name: Smoke test (x86_64 via Rosetta)
        # The Intel slice of the universal binary must run; a runner without
        # Rosetta fails here rather than skipping the test. Installed only
        # when missing, with retries (Apple's update catalog fails now and
        # then).
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            for i in 1 2 3; do
              sudo softwareupdate --install-rosetta --agree-to-license && break
              sleep 30
            done
          fi
          exe=$(ls zip/lexiftool-macos-*/lexiftool)
          arch -x86_64 /usr/bin/true
          sh standalone/smoke.sh arch -x86_64 "$exe"

  # The Windows executable runs under wine on the Linux build runner already;
  # this job additionally runs it natively on a Windows runner.
  windows-smoke:
    name: Windows smoke
    needs: standalone
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/download-artifact@v8
        with:
          name: lexiftool-windows-${{ github.sha }}
          path: zip

      - name: Extract the archive
        shell: pwsh
        run: |
          # Git Bash has neither unzip nor a zip-capable tar; PowerShell's
          # Expand-Archive does the job.
          Get-ChildItem zip/*.zip | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath zip -Force
          }

      - name: Smoke test (native Windows)
        shell: bash
        run: |
          exe=$(ls zip/lexiftool-windows-*/lexiftool.exe)
          sh standalone/smoke.sh "$exe"

  # Performance comparison with the Perl original (benchmark.yml), on the
  # Linux executable this run built -- so the chart belongs to exactly the
  # binaries published below.
  benchmark:
    needs: standalone
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write      # the called workflow's Pages job
      id-token: write
    uses: ./.github/workflows/benchmark.yml
    with:
      artifact: lexiftool-linux-${{ github.sha }}
      publish: ${{ github.ref == 'refs/heads/master' }}   # the Pages site: the chart the README shows

  # The rolling pre-release "latest-dev": the executables of the newest
  # commit on master, with the benchmark chart and table, for anyone who
  # wants the newest commit without waiting for a tagged version. Deleting
  # the old release AND its tag, then letting `gh release create` recreate
  # the tag at the new commit through the API: a raw `git push -f` that
  # MOVES an existing tag is rejected by GitHub whenever the target commit
  # changes a file under .github/workflows/ ("refusing to allow a GitHub
  # App to ... update workflow ... without `workflows` permission" -- a
  # restriction GITHUB_TOKEN can never be granted). Creating the tag fresh
  # sidesteps that check.
  publish-latest-dev:
    name: publish latest-dev
    needs: [standalone, benchmark, macos-smoke, windows-smoke]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # git describe for the notes

      - uses: actions/download-artifact@v8
        with:
          pattern: lexiftool-*-${{ github.sha }}
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: benchmark-${{ github.sha }}
          path: bench

      - name: release notes
        run: |
          identity=$(git describe --tags --always --long --match 'v*')
          {
            echo "Automatically built from the latest commit on master ($identity). Not a release: see the Releases page for tagged versions."
            echo
            echo "Each archive holds a folder with the executable, the licenses and the license texts of the built-in components; \`lexiftool -ver -v\` prints the build's identity."
            echo
            echo "[Performance comparison with Perl ExifTool](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/) for this build; its data: \`results.json\` below."
          } > notes.md

      - name: publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-dev --yes --cleanup-tag || true
          gh release create latest-dev dist/*.zip bench/benchmark.svg bench/benchmark-dark.svg bench/results.json \
            --prerelease --title "Development build" \
            --target "$(git rev-parse HEAD)" --notes-file notes.md

  # The release of a version tag: the same contents, created once, here
  # (not by each matrix build, racing for it).
  publish-release:
    name: publish release
    needs: [standalone, benchmark, macos-smoke, windows-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: lexiftool-*-${{ github.sha }}
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: benchmark-${{ github.sha }}
          path: bench

      - name: release notes
        run: |
          {
            echo "Standalone executables for Linux (x86-64, glibc 2.17 or newer), macOS (11 or newer, universal) and Windows (x64): unzip and run, no Lua or Perl needed. Each archive holds a folder with the executable, the licenses and the license texts of the built-in components."
            echo
            echo "Performance comparison with Perl ExifTool for this build: \`benchmark.svg\` and \`results.json\` below (the chart of the latest snapshot: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)."
          } > notes.md

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # created once, here; the generated notes (the commits since the
          # previous tag) follow the benchmark
          gh release create "$GITHUB_REF_NAME" dist/*.zip bench/benchmark.svg bench/benchmark-dark.svg bench/results.json \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
